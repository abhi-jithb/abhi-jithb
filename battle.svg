<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bigglow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="goldgrad" x1="0" x2="1"><stop offset="0" stop-color="#fff1c4"/><stop offset=".5" stop-color="#f5c451"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient>
<linearGradient id="bloodgrad" x1="0" x2="1"><stop offset="0" stop-color="#ff3b5c"/><stop offset="1" stop-color="#9b6bff"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#ff3b5c" stop-opacity=".28"/><stop offset=".6" stop-color="#9b6bff" stop-opacity=".08"/><stop offset="1" stop-color="#9b6bff" stop-opacity="0"/></radialGradient>
<radialGradient id="vignette" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#1d1029"/><stop offset="1" stop-color="#07040b"/></radialGradient>
</defs>
<style>
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite reverse}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.fade{opacity:0;animation:fadein .7s ease-out forwards}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}

@keyframes shoot{0%{offset-distance:0%;opacity:0}10%{opacity:1}85%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes dmg{0%{opacity:0;transform:translateY(0)}10%{opacity:1}60%{opacity:1;transform:translateY(-30px)}100%{opacity:0;transform:translateY(-40px)}}
@keyframes shake{0%,70%,100%{transform:translateX(0)}75%{transform:translateX(-6px)}80%{transform:translateX(6px)}85%{transform:translateX(-4px)}90%{transform:translateX(3px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0.211)}}</style>

<rect width="1000" height="360" rx="16" fill="url(#vignette)"/><rect x="10" y="10" width="980" height="340" rx="10" fill="none" stroke="#2a1838" stroke-width="1.5"/><path d="M10 32 L10 10 L32 10" stroke="#f5c451" stroke-width="2.5" fill="none" filter="url(#glow)"/><circle cx="10" cy="10" r="3.5" fill="#f5c451"/><path d="M990 32 L990 10 L968 10" stroke="#f5c451" stroke-width="2.5" fill="none" filter="url(#glow)"/><circle cx="990" cy="10" r="3.5" fill="#f5c451"/><path d="M10 328 L10 350 L32 350" stroke="#f5c451" stroke-width="2.5" fill="none" filter="url(#glow)"/><circle cx="10" cy="350" r="3.5" fill="#f5c451"/><path d="M990 328 L990 350 L968 350" stroke="#f5c451" stroke-width="2.5" fill="none" filter="url(#glow)"/><circle cx="990" cy="350" r="3.5" fill="#f5c451"/><text x="500.0" y="40" text-anchor="middle" font-family="'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif" font-size="17" letter-spacing="5" fill="#f5c451" font-weight="700">BOSS RAID · THE LEGACY CODE BEHEMOTH</text><path d="M270.0 34 H330.0 M670.0 34 H730.0" stroke="#f5c451" stroke-opacity=".5"/>
<circle cx="618" cy="257" r="0.8" fill="#f5c451" class="twinkle" style="animation-delay:2.33s"/><circle cx="259" cy="37" r="1" fill="#f1e8da" class="twinkle" style="animation-delay:1.12s"/><circle cx="854" cy="142" r="0.8" fill="#9b6bff" class="twinkle" style="animation-delay:0.75s"/><circle cx="722" cy="151" r="1" fill="#f5c451" class="twinkle" style="animation-delay:0.48s"/><circle cx="785" cy="64" r="1.7" fill="#f1e8da" class="twinkle" style="animation-delay:0.40s"/><circle cx="953" cy="22" r="1" fill="#f1e8da" class="twinkle" style="animation-delay:2.62s"/><circle cx="298" cy="328" r="1" fill="#f1e8da" class="twinkle" style="animation-delay:2.82s"/><circle cx="683" cy="329" r="1.7" fill="#f5c451" class="twinkle" style="animation-delay:0.06s"/><circle cx="418" cy="319" r="1.3" fill="#f1e8da" class="twinkle" style="animation-delay:1.00s"/><circle cx="805" cy="208" r="1.3" fill="#f1e8da" class="twinkle" style="animation-delay:0.93s"/><circle cx="806" cy="174" r="1.3" fill="#f1e8da" class="twinkle" style="animation-delay:1.44s"/><circle cx="696" cy="38" r="0.8" fill="#9b6bff" class="twinkle" style="animation-delay:1.07s"/><circle cx="408" cy="196" r="1.7" fill="#f5c451" class="twinkle" style="animation-delay:1.13s"/><circle cx="828" cy="165" r="1" fill="#9b6bff" class="twinkle" style="animation-delay:2.87s"/><circle cx="209" cy="262" r="1.7" fill="#f5c451" class="twinkle" style="animation-delay:1.54s"/><circle cx="877" cy="100" r="1.7" fill="#f1e8da" class="twinkle" style="animation-delay:1.77s"/><circle cx="770" cy="138" r="1.3" fill="#f1e8da" class="twinkle" style="animation-delay:1.30s"/><circle cx="959" cy="87" r="1.3" fill="#f1e8da" class="twinkle" style="animation-delay:1.02s"/><circle cx="907" cy="194" r="1.3" fill="#9b6bff" class="twinkle" style="animation-delay:0.95s"/><circle cx="190" cy="45" r="1" fill="#9b6bff" class="twinkle" style="animation-delay:2.07s"/><circle cx="977" cy="72" r="0.8" fill="#f1e8da" class="twinkle" style="animation-delay:2.96s"/><circle cx="532" cy="150" r="1" fill="#9b6bff" class="twinkle" style="animation-delay:1.78s"/><circle cx="813" cy="166" r="1.7" fill="#f1e8da" class="twinkle" style="animation-delay:0.17s"/><circle cx="899" cy="30" r="1.7" fill="#f5c451" class="twinkle" style="animation-delay:2.52s"/><circle cx="145" cy="254" r="1" fill="#9b6bff" class="twinkle" style="animation-delay:2.69s"/><circle cx="417" cy="74" r="1.3" fill="#f1e8da" class="twinkle" style="animation-delay:0.18s"/><circle cx="424" cy="65" r="1" fill="#9b6bff" class="twinkle" style="animation-delay:1.36s"/><circle cx="489" cy="253" r="1.7" fill="#f5c451" class="twinkle" style="animation-delay:0.87s"/><circle cx="408" cy="67" r="1.7" fill="#9b6bff" class="twinkle" style="animation-delay:2.88s"/><circle cx="622" cy="180" r="1.3" fill="#f1e8da" class="twinkle" style="animation-delay:0.27s"/>
<path d="M30 236 H970" stroke="#2a1838" stroke-width="2"/>
<ellipse cx="230" cy="236" rx="70" ry="10" fill="#ff3b5c" opacity=".25" class="pulse"/>
<ellipse cx="760" cy="236" rx="120" ry="14" fill="#9b6bff" opacity=".2" class="pulse"/>

<!-- mage -->
<g style="animation:bob 2.4s ease-in-out infinite">
  <path d="M195 232 L230 150 L265 232 Z" fill="#3a0f22" stroke="#ff3b5c" stroke-width="2"/>
  <path d="M212 200 L248 200" stroke="#f5c451" stroke-width="3"/>
  <circle cx="230" cy="138" r="16" fill="#f1d3b3"/>
  <path d="M206 132 L230 84 L256 132 Z" fill="#1d0b30" stroke="#9b6bff" stroke-width="2"/>
  <path d="M206 132 Q230 140 256 132" stroke="#f5c451" stroke-width="3" fill="none"/>
  <circle cx="236" cy="140" r="2" fill="#000"/>
  <path d="M262 232 L292 150" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="296" cy="166" r="11" fill="#f5c451" filter="url(#bigglow)" class="pulse"/>
  <g><animateTransform attributeName="transform" type="rotate" from="0 296 166" to="360 296 166" dur="6s" repeatCount="indefinite"/><circle cx="296" cy="166" r="22" fill="none" stroke="#f5c451" stroke-dasharray="3 5"/></g>
</g>
<text x="230" y="70" text-anchor="middle" font-family="'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif" font-size="14" fill="#f5c451" letter-spacing="2">ABHIJITH · LV 17</text>

<circle r="9" fill="#ff3b5c" filter="url(#bigglow)" style="animation:shoot 2.4s cubic-bezier(.5,0,.8,.6) 0.0s infinite;offset-path:path('M300 170 Q 520 60 730 195')"/><circle r="9" fill="#f5c451" filter="url(#bigglow)" style="animation:shoot 2.4s cubic-bezier(.5,0,.8,.6) 0.6s infinite;offset-path:path('M300 170 Q 520 85 730 195')"/><circle r="9" fill="#9b6bff" filter="url(#bigglow)" style="animation:shoot 2.4s cubic-bezier(.5,0,.8,.6) 1.2s infinite;offset-path:path('M300 170 Q 520 110 730 195')"/><circle r="9" fill="#ff7a3d" filter="url(#bigglow)" style="animation:shoot 2.4s cubic-bezier(.5,0,.8,.6) 1.8s infinite;offset-path:path('M300 170 Q 520 135 730 195')"/>

<!-- boss -->
<g style="animation:shake 2.4s ease-in-out 1.8s infinite">
