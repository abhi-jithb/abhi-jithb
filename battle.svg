<text x="44" y="258" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="14" fill="#f1e8da" class="fade" style="animation-delay:0.6s">⚔ Commit Barrage hits for 789 this year!</text><text x="44" y="280" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="14" fill="#f1e8da" class="fade" style="animation-delay:1.1s">🗡 Pull Request Lance: 56 casts, 48 merged</text><text x="44" y="302" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="14" fill="#f1e8da" class="fade" style="animation-delay:1.6s">🪶 Issue Seal binds 52 bugs</text><text x="44" y="324" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="14" fill="#f1e8da" class="fade" style="animation-delay:2.1s">🔥 Streak Aura burning for 4 days</text>
