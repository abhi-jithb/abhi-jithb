  <ellipse cx="795" cy="150" rx="14" ry="10" fill="#ff3b5c" filter="url(#glow)" class="pulse"/>
  <path d="M720 188 Q760 172 800 188" stroke="#ff3b5c" stroke-width="3" fill="none"/>
  <text x="760" y="132" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#9a8cae">// TODO: refactor</text>
